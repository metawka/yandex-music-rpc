[package]
name = "yandex-music-rpc"
version = "1.0.0"
edition = "2024"
description = "Discord Rich Presence for Yandex Music desktop app"
license = "MIT"
repository = "https://github.com/metawka/yandex-music-rpc"

[dependencies]
serde_json = "1.0.154"
tray-icon = "0.26.1"
windows = { version = "0.58", features = ["Media_Control", "Foundation", "Foundation_Collections", "Web_Http", "Web_Http_Headers", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Security"] }
winreg = "0.56.0"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
